# RMTC system config - used exclusively by CI test workflows (ci_tests.yaml, ci_code_quality.yaml)

# Config metadata
_type:          config
_version:       1.0.0
_name:          rmtc

rmtc_system:
  mode:         TESTING

rmtc_store:
  type_name:    rmtc_core.Store.AGE-1.0.0
  uri:          postgres://localhost:5432
  name:         test
  db_name:      postgresDB
  immutable:    false
  limit:        25
  timeout:      6000

rmtc_tracker:
  type_name:    rmtc_core.Tracker.TensorBoard-1.0.0
  uri:          file:./rmtc_tracker_storage

rmtc_log:
  type_name:    rmtc_sys.Logger.Logger-1.0.0
  level:        INFO

rmtc_asset_manager:
  type_name:    rmtc_ops.AssetManager.AssetManager-1.0.0

rmtc_publisher:
  type_name:    rmtc_core.Publisher.DiskPublisher-1.0.0
  immutable:    false
  root:         "/"

rmtc_readerwriter:
  type_name:    rmtc_core.ReaderWriter.DiskReaderWriter-1.0.0
  immutable:    false
  root:         "/"

rmtc_pipelines:
  Nuke:
    - type_name:  rmtc_core.Builder.CATBuilder-1.0.0
    - type_name:  rmtc_core.Builder.TorchScriptBuilder-1.0.0
  Houdini:
    - type_name:  rmtc_core.Builder.ONNXBuilder-1.0.0

rmtc_objects:
  type_name:    rmtc_sys.Objects.Objects-1.0.0

rmtc_env_manager:
  type_name:    rmtc_core.EnvManager.PackageTracker-1.0.0

rmtc_jit:
  type_name:    rmtc_sys.JIT.Sync-1.0.0
