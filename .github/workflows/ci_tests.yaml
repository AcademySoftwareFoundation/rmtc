name: CI_Tests

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  tests:
    name: "Tests"
    runs-on: ubuntu-22.04
    env:
      RMTC_CONFIGS: .github/rmtc-config-ci-tests.yaml
      RMTC_MODULES: res/modules
      RMTC_RESOURCES: res
      RMTC_USER: postgres
      RMTC_PW: postgres
      QT_QPA_PLATFORM: offscreen

    strategy:
      fail-fast: false
      matrix:
          python-version:
            - "3.9"

    services:
      age:
        image: apache/age@sha256:4241e2d8bb86a6b2ea44e9ad06c73856e12b209de295124603a599dd7feb70eb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgresDB
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false  # prevent credentials from persisting in the workspace

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client-common postgresql-client

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0; uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Create AGE extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgresDB -c "CREATE EXTENSION IF NOT EXISTS age;"

      - name: Install python dependencies
        run: |
          uv venv --python python${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Install Qt binding (PySide2)
        if: matrix.python-version == '3.9'
        run: uv pip install PySide2==5.15.2.1

      - name: Install Qt binding (PySide6)
        if: matrix.python-version != '3.9'
        run: uv pip install PySide6

      - name: Run core tests
        run: |
          uv run pytest tests/core/ 

      - name: Run system tests
        run: |
          uv run pytest tests/system/

      - name: Run track tests
        run: |
          uv run pytest tests/track/

      - name: Run ops tests
        run: |
          uv run pytest tests/ops/

      - name: Run gui tests
        run: |
          uv run pytest tests/gui/
